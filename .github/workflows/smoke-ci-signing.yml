name: Smoke test isolated CI CMS signing identity
on:
  workflow_dispatch:
  push:
    branches: [feature/usb-runtime-storage]
    paths:
      - '.github/workflows/smoke-ci-signing.yml'
permissions:
  contents: read
jobs:
  test-identity:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import and trust ephemeral non-Apple test identity
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ci-self-signed.keychain-db"
          security create-keychain -p ci-pass "$keychain"
          security unlock-keychain -p ci-pass "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=LiveSimBooter Untrusted CI Signing Test/OU=CI/O=Test/C=US" \
            -addext 'keyUsage=critical,digitalSignature' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'extendedKeyUsage=codeSigning' \
            -keyout "$RUNNER_TEMP/ci.key" -out "$RUNNER_TEMP/ci.crt"
          openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/ci.key" \
            -in "$RUNNER_TEMP/ci.crt" -out "$RUNNER_TEMP/ci.p12" -passout pass:ci-test
          security import "$RUNNER_TEMP/ci.p12" -k "$keychain" -P ci-test -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-pass "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          # The ephemeral CI user-keychain 'add-trusted-cert' asks for UI
          # authorization and deadlocks. Try the system admin path with
          # passwordless sudo, available on ephemeral GitHub macOS runners.
          python3 - "$RUNNER_TEMP/ci.crt" <<'PY'
          import subprocess,sys
          cmd=['sudo','-n','security','add-trusted-cert','-d','-r','trustAsRoot',
               '-k','/Library/Keychains/System.keychain',sys.argv[1]]
          print('Trusting disposable CI certificate in temporary runner',flush=True)
          subprocess.run(cmd,check=True,timeout=35)
          PY
          security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
          grep -q 'LiveSimBooter Untrusted CI Signing Test' "$RUNNER_TEMP/identities.txt"
      - name: Sign and verify tiny local macOS executable (NOT iPhone-authorized)
        shell: bash
        run: |
          set -euo pipefail
          echo 'int main(void) { return 0; }' > "$RUNNER_TEMP/test.c"
          xcrun clang -arch arm64 "$RUNNER_TEMP/test.c" -o "$RUNNER_TEMP/test"
          digest="$(openssl x509 -in "$RUNNER_TEMP/ci.crt" -noout -fingerprint -sha1 | sed 's/^.*=//;s/://g')"
          codesign --force --sign "$digest" --timestamp=none "$RUNNER_TEMP/test"
          codesign --verify --verbose=4 "$RUNNER_TEMP/test"
          echo "PASS: CMS identity recognized by codesign in headless CI, not signed for iPhone."
      - name: Remove test keychain/certificate
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ci.crt" ]; then
            cert="$(openssl x509 -in "$RUNNER_TEMP/ci.crt" -noout -fingerprint -sha1 | sed 's/^.*=//;s/://g')"
            sudo -n security delete-certificate -Z "$cert" /Library/Keychains/System.keychain || true
          fi
          security delete-keychain "$RUNNER_TEMP/ci-self-signed.keychain-db" || true
          rm -f "$RUNNER_TEMP/ci.key" "$RUNNER_TEMP/ci.crt" "$RUNNER_TEMP/ci.p12"
